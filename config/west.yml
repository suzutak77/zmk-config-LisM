manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: 4mplelab
      url-base: https://github.com/4mplelab
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ── ZMK 本体 ────────────────────────────────────────────────
    # DYA Studio の最新機能 (ランタイムマクロ / ランタイムコンボ) は
    # cormoran さんの custom Studio RPC プロトコルを含む ZMK でしか動かない。
    # `main+dya` は `main+custom-studio-protocol` を包含する DYA 向けブランチで、
    # cormoran/zmk-keyboard-dya2 v2.0 が実際に採用している構成。
    # ベースは ZMK v0.4 系 (Zephyr 4.1) で、旧 `v0.3-branch+dya` (Zephyr 3.5) から
    # メジャーバージョンが上がっている点に注意。
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      # v0.3 support was split out to v0.3-branch; main now tracks ZMK main/Zephyr 4.x
      revision: main
    - name: zmk-feature-charge-indicator
      remote: 4mplelab
      revision: main

    - name: zmk-module-ble-management
      remote: cormoran
      # main @ 2026-07-05 (zmk-v0.4.0.0 tag not published yet for this module)
      revision: 57738cc4fc6ba80e82a7ac57741a0339cb186cd4
    - name: zmk-module-battery-history
      remote: cormoran
      # main @ 2026-02-24 (no tags published for this module)
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    - name: zmk-feature-device-info
      remote: cormoran
      revision: 8cedd2dd9f04e19ea5a17b94914dd47a09d8db11
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: d9490e7b5d41c516221d131241009e81740efcee
      import: true
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: 38530962eb7061b60efcb98e84585cfb1f0cb6de
      import: true
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: 84ad14c6c3645dc40b23f45d08ab45418655f912
    # キースイッチ (キー押下統計とチャタリング検出)
